# Definição do Job (workflow) que orquestra o pipeline Bronze -> Silver -> Gold
# Documentação: https://docs.databricks.com/dev-tools/bundles/resources.html#job

resources:
  jobs:
    etl_pipeline_job:
      name: "[${bundle.target}] ETL Pipeline - Bronze/Silver/Gold"

      schedule:
        # Cadência near-time: a cada 15 minutos, para acompanhar o andamento
        # da Black Friday em quase tempo real. Fora da janela do evento, o
        # job deve ficar pausado (ou trocar para uma cadência diária, como
        # antes) para evitar processamento/custo desnecessário.
        quartz_cron_expression: "0 */15 * * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: PAUSED # remova/mude para UNPAUSED quando o pipeline estiver validado

      email_notifications:
        on_failure:
          - seu-email@empresa.com

      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 2
            data_security_mode: SINGLE_USER
            autoscale:
              min_workers: 1
              max_workers: 4

      tasks:
        - task_key: bronze_ingestion
          job_cluster_key: default_cluster
          notebook_task:
            notebook_path: ../../notebooks/01_bronze_ingestion.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema_bronze}
              black_friday_year: ${var.black_friday_year}

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: default_cluster
          notebook_task:
            notebook_path: ../../notebooks/02_silver_transformation.py
            base_parameters:
              catalog: ${var.catalog}
              schema_bronze: ${var.schema_bronze}
              schema_silver: ${var.schema_silver}

        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_transformation
          job_cluster_key: default_cluster
          notebook_task:
            notebook_path: ../../notebooks/03_gold_aggregation.py
            base_parameters:
              catalog: ${var.catalog}
              schema_silver: ${var.schema_silver}
              schema_gold: ${var.schema_gold}
