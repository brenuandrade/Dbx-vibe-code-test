# Databricks Asset Bundle configuration
# Documentação: https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: dbx-vibe-code-test

include:
  - resources/*.yml
  - resources/**/*.yml

variables:
  catalog:
    description: Catálogo do Unity Catalog usado pelo pipeline
    default: main
  schema_bronze:
    description: Schema da camada Bronze
    default: bronze
  schema_silver:
    description: Schema da camada Silver
    default: silver
  schema_gold:
    description: Schema da camada Gold
    default: gold
  black_friday_year:
    description: >-
      Ano de referência da Black Friday simulada (a data exata é calculada
      como a última sexta-feira de novembro desse ano).
    default: "2026"
  admin_group:
    description: >-
      Grupo do Unity Catalog com acesso irrestrito às colunas PII das
      tabelas Gold (via is_account_group_member nas máscaras de coluna).
    default: admins
  analyst_group:
    description: >-
      Grupo do Unity Catalog com SELECT nas tabelas Gold, mas sem acesso ao
      valor real das colunas PII (vê os dados mascarados).
    default: analysts
  run_stress_test:
    description: >-
      Se "true", a task de Gold também roda os cenários de data skew e pico
      de ingestão (ver data_engineering.gold.simulate), gravando os
      resultados em tabelas *_stress_test separadas das métricas reais.
    default: "false"

artifacts:
  data_engineering_wheel:
    type: whl
    build: python setup.py bdist_wheel
    path: .

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-fc266d3f-2a0d.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev

  # staging/prod ainda apontam para placeholders — atualize o host (e, se for
  # o caso, o service principal) quando esses workspaces existirem. Por ora
  # o projeto roda inteiramente no workspace único configurado em "dev":
  # dbc-fc266d3f-2a0d.cloud.databricks.com
  staging:
    mode: production
    workspace:
      host: https://<seu-workspace-staging>.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: staging
    run_as:
      service_principal_name: <service-principal-staging>

  prod:
    mode: production
    workspace:
      host: https://<seu-workspace-prod>.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
    run_as:
      service_principal_name: <service-principal-prod>
