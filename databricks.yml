# Databricks Asset Bundle configuration
# Documentação: https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: dbx-vibe-code-test

include:
  - resources/*.yml
  - resources/**/*.yml

variables:
  catalog:
    description: Catálogo do Unity Catalog usado pelo pipeline
    default: main
  schema_bronze:
    description: Schema da camada Bronze
    default: bronze
  schema_silver:
    description: Schema da camada Silver
    default: silver
  schema_gold:
    description: Schema da camada Gold
    default: gold
  black_friday_year:
    description: >-
      Ano de referência da Black Friday simulada (a data exata é calculada
      como a última sexta-feira de novembro desse ano).
    default: "2026"
  admin_group:
    description: >-
      Grupo do Unity Catalog com acesso irrestrito às colunas PII das
      tabelas Gold (via is_account_group_member nas máscaras de coluna).
    default: admins
  analyst_group:
    description: >-
      Grupo do Unity Catalog com SELECT nas tabelas Gold, mas sem acesso ao
      valor real das colunas PII (vê os dados mascarados).
    default: analysts
  run_stress_test:
    description: >-
      Se "true", a task de Gold também roda os cenários de data skew e pico
      de ingestão (ver data_engineering.gold.simulate), gravando os
      resultados em tabelas *_stress_test separadas das métricas reais.
    default: "false"

artifacts:
  data_engineering_wheel:
    type: whl
    build: python setup.py bdist_wheel
    path: .

# dev, staging e prod compartilham hoje o único workspace disponível
# (dbc-fc266d3f-2a0d.cloud.databricks.com), isolados entre si por dois
# eixos: o catálogo do Unity Catalog (dev/staging/prod, cada um com seus
# próprios schemas bronze/silver/gold) e o root_path (pasta pessoal do
# usuário em dev; /Shared/.bundle/.../staging e /Shared/.bundle/.../prod,
# que não colidem entre si). Nenhum target usa run_as dedicado ainda: o
# deploy roda com a identidade do token cadastrado em DBX_SECRET_TRIAL —
# trocar por um service principal por ambiente quando estiverem disponíveis.
#
# O host é repetido em cada target de propósito: `workspace.host` é um
# campo de autenticação, resolvido pela Databricks CLI *antes* das
# variáveis do bundle serem processadas — `${var...}` não é interpolado
# aqui (a CLI falha com "Variable interpolation is not supported for
# fields that configure authentication"). Para trocar o host de um target
# específico no futuro, edite o valor literal deste target — não há como
# centralizar isso numa única variável.
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-fc266d3f-2a0d.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev

  staging:
    mode: production
    workspace:
      host: https://dbc-fc266d3f-2a0d.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: staging

  prod:
    mode: production
    workspace:
      host: https://dbc-fc266d3f-2a0d.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
